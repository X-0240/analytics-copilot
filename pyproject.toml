# 检查规范：ruff 做检查、Black 做排版，行宽 80；与既有三个项目保持一致
[tool.black]
line-length = 80
target-version = ["py310"]

[tool.ruff]
line-length = 80
target-version = "py310"
src = ["src"]
exclude = [".git", ".venv", "__pycache__", ".pytest_cache", ".ruff_cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "UP031", "N818", "B008", "B905", "SIM115"]
